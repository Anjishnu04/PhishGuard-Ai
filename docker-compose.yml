version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:4000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    depends_on:
      - ml
    environment:
      - PORT=4000
      - ML_SERVICE_URL=http://ml:5000
      - FRONTEND_URL=http://localhost:3000
      # Add your keys in .env or as secrets
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - GOOGLE_SAFEBROWSING_KEY=${GOOGLE_SAFEBROWSING_KEY}

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
